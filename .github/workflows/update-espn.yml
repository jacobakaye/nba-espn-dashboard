
name: Refresh ESPN NBA data

on:
  workflow_dispatch:
    inputs:
      nba_date:
        description: "Optional YYYY-MM-DD. Blank = today."
        required: false
        default: ""
        type: string

  schedule:
    - cron: "17 10,14,18,22 * * *"

permissions:
  contents: write

concurrency:
  group: espn-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Update ESPN NBA Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      TZ: America/New_York

    defaults:
      run:
        shell: bash

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Ubuntu system dependencies
      - name: Install system libraries
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev

          pkg-config --modversion libcurl

      # 3. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # 4. Install required R packages
      - name: Install R dependencies
        run: |
          Rscript -e '
            options(
              repos = c(
                sportsdataverse =
                  "https://sportsdataverse.r-universe.dev",
                CRAN = "https://cloud.r-project.org"
              )
            )

            install.packages(
              c("curl", "httr", "httr2", "rvest")
            )

            install.packages(
              c("hoopR", "jsonlite")
            )

            required <- c(
              "curl",
              "httr",
              "httr2",
              "rvest",
              "hoopR",
              "jsonlite"
            )

            missing <- required[
              !vapply(
                required,
                requireNamespace,
                logical(1),
                quietly = TRUE
              )
            ]

            if (length(missing) > 0) {
              stop(
                "Missing R packages: ",
                paste(missing, collapse = ", ")
              )
            }

            cat(
              "hoopR version:",
              as.character(packageVersion("hoopR")),
              "\n"
            )

            cat("All R dependencies installed.\n")
          '

      # 5. Determine NBA date
      - name: Set NBA date
        env:
          REQUESTED_DATE: ${{ inputs.nba_date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            NBA_DATE="$REQUESTED_DATE"
          else
            NBA_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          fi

          if ! [[ "$NBA_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date format: $NBA_DATE"
            exit 1
          fi

          if ! date -u -d "$NBA_DATE" +%F | grep -Fxq "$NBA_DATE"; then
            echo "Invalid calendar date: $NBA_DATE"
            exit 1
          fi

          echo "NBA_DATE=$NBA_DATE" >> "$GITHUB_ENV"
          echo "Using NBA date: $NBA_DATE"

      # 6. Fetch ESPN data
      - name: Retrieve ESPN NBA data
        run: |
          echo "Fetching NBA data for $NBA_DATE"
          Rscript scripts/update_data.R

      # 7. Verify output files
      - name: Verify generated JSON
        run: |
          if [ ! -d "public/data" ]; then
            echo "ERROR: public/data is missing"
            exit 1
          fi

          echo "Generated JSON files:"
          find public/data -type f -name "*.json" | head -30

      # 8. Commit new ESPN data
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update ESPN NBA data for $NBA_DATE"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "ESPN NBA data successfully updated!"
